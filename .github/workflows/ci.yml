name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Testcontainers starts its own Postgres. No `services:` block here on
      # purpose — the tests declare the database they need, so `./gradlew test`
      # does the same thing on a laptop as it does here. A service defined in
      # the workflow would be a second, invisible dependency that only CI has.
      - name: Test
        run: ./gradlew test --no-daemon

      - name: Build jar
        run: ./gradlew bootJar --no-daemon -x test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds the image and then proves it actually serves traffic. An image
      # that builds is not an image that runs — a missing entrypoint, a wrong
      # jar path or a JVM that dies on startup all build perfectly.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: matchbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run it and place an order
        run: |
          docker network create matchbox-ci
          docker run -d --name db --network matchbox-ci \
            -e POSTGRES_DB=matchbox -e POSTGRES_USER=matchbox -e POSTGRES_PASSWORD=matchbox \
            postgres:17-alpine
          until docker exec db pg_isready -U matchbox -d matchbox; do sleep 2; done

          docker run -d --name app --network matchbox-ci -p 8080:8080 \
            -e DATABASE_URL=jdbc:postgresql://db:5432/matchbox \
            -e DATABASE_USER=matchbox -e DATABASE_PASSWORD=matchbox \
            matchbox:ci

          for i in $(seq 1 30); do
            curl -sf localhost:8080/actuator/health && break
            sleep 3
          done

          # A resting sell, then a buy that crosses it. Asserts the trade came
          # back — a smoke test that exercises matching, persistence and JSON
          # rather than only checking that the port is open.
          curl -sS -X POST localhost:8080/api/v1/orders \
            -H 'Content-Type: application/json' \
            -d '{"side":"SELL","type":"LIMIT","price":5000,"quantity":5}' -o /dev/null

          RESULT=$(curl -sS -X POST localhost:8080/api/v1/orders \
            -H 'Content-Type: application/json' \
            -d '{"side":"BUY","type":"LIMIT","price":5200,"quantity":5}')

          echo "$RESULT"
          # Executed at the resting price, not the incoming bid.
          echo "$RESULT" | grep -q '"price":5000' || { echo "expected a fill at 5000"; docker logs app; exit 1; }
          echo "$RESULT" | grep -q '"status":"FILLED"' || { echo "expected FILLED"; exit 1; }

      - name: Application logs on failure
        if: failure()
        run: docker logs app || true
